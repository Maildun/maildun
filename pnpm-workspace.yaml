packages:
  - '.'

# unrs-resolver (via eslint-import-resolver-typescript) only needs its build
# script to compile a native binary on platforms it has no prebuilt binding for.
# Every platform we build on resolves one from its optionalDependencies
# (@unrs/resolver-binding-linux-x64-gnu on CI), so the script stays blocked.
allowBuilds:
  unrs-resolver: false

publicHoistPattern:
  - '@inertiajs/core'

# Each floor below raises a transitive package to a patched release; drop an
# entry once the lockfile no longer resolves anything older.
# - dompurify: @maildun/email-builder locked 3.4.16, affected by
#   GHSA-cg2g-xh64-v4q7 and GHSA-mrv2-3pqr-j5jr.
# - minimatch: eslint 10, @eslint/config-array, typescript-eslint and
#   eslint-plugin-import-x all ask for ^10, and every 10.x release is affected
#   by GHSA-g3hv-75wg-m249 (fixed only in 11.0.1). Nothing they use was removed
#   in 11 except makeRe() in import-x's no-internal-modules rule, which the
#   patch under patchedDependencies replaces. Drop the floor and the patch once
#   those packages ask for minimatch 11 themselves.
# - shell-quote: concurrently 10 pins exactly 1.9.0, affected by
#   GHSA-pqg4-j6r4-53mv, so only an override can lift it.
# - source-map-js: postcss (through vite) and @tailwindcss/node locked 1.2.1,
#   affected by GHSA-68fv-2mgg-jv7q.
# - zod: @maildun/email-builder locked 4.6.5, affected by GHSA-mrhx-c7xc-m3w5.
overrides:
  dompurify@<3.4.17: ^3.4.17
  minimatch@>=10.0.0 <11.0.1: ^11.0.3
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  zod@>=4.0.0 <4.6.6: ^4.6.7

# minimatch 11 removed makeRe(); import-x's no-internal-modules rule imported it
# at load time, which broke the whole plugin. The patch matches with Minimatch
# objects instead, with the same result.
patchedDependencies:
  eslint-plugin-import-x@4.17.1: patches/eslint-plugin-import-x@4.17.1.patch

minimumReleaseAgeExclude:
  - '@maildun/email-builder@0.6.0'
