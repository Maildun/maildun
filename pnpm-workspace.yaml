packages:
  - '.'

# unrs-resolver (via eslint-import-resolver-typescript) only needs its build
# script to compile a native binary on platforms it has no prebuilt binding for.
# Every platform we build on resolves one from its optionalDependencies
# (@unrs/resolver-binding-linux-x64-gnu on CI), so the script stays blocked.
allowBuilds:
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@maildun/email-builder@0.1.0'

publicHoistPattern:
  - '@inertiajs/core'

# minimatch 10 (reached through typescript-eslint) asks for brace-expansion ^5.0.5,
# and a lockfile refresh keeps the 5.0.9 it locked, which is affected by
# GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr. The floor
# below is the first patched release; drop it once the lockfile no longer
# resolves anything older.
#
# shadcn's Express pulls proxy-addr 2.0.7 (GHSA-jqcg-44mw-7w3h). Vite and
# Tailwind pull source-map-js 1.2.1 (GHSA-68fv-2mgg-jv7q). These floors are
# the first patched releases.
overrides:
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  proxy-addr@<2.0.8: 2.0.8
  source-map-js@<1.2.2: 1.2.2

# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) has no patched release. It is only
# reached through the shadcn CLI's fast-glob, not the running application.
# Drop this ignore once braces publishes a fix.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
