# Maildun, self-hosted.
#
# Three processes run the application and all three are required. The web
# container alone will accept a campaign and never send it, because sending
# happens on the queue.
#
#   app        serves HTTP and applies migrations on start
#   horizon    drains the queues: delivery, imports, tracking, automations
#   scheduler  fires automation timers, segment sync, and cleanup every minute
#
# First run:
#   cp .env.example .env
#   docker compose run --rm --entrypoint php app artisan key:generate --show   # paste into .env
#   docker compose up -d
#   docker compose exec app php artisan app:install --no-interaction \
#       --admin-name="Your Name" --admin-email=you@example.com \
#       --admin-password='a-strong-password' --registration=closed

name: maildun

x-app-env: &app-env
  # Overrides .env, which points at a developer's own machine.
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-maildun}
  DB_USERNAME: ${DB_USERNAME:-maildun}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: maildun:local
  restart: unless-stopped
  env_file:
    - .env
  environment: *app-env
  volumes:
    # Uploaded media, Passport signing keys, and logs. Losing this volume
    # invalidates every issued API token.
    - storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      # Only this service migrates. Three services starting together would
      # otherwise race each other through the same migration table.
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-80}:8080"

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    # Horizon drains its current jobs on SIGTERM. Cutting that short can
    # duplicate a send, so give it room.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-maildun}
      POSTGRES_USER: ${DB_USERNAME:-maildun}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-maildun} -d ${DB_DATABASE:-maildun}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queued sends and scheduled jobs live here. Without persistence a restart
    # drops anything not yet delivered.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  storage:
  postgres:
  redis:
