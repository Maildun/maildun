name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous commit. Runs
# on main are never cancelled, so every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          tools: composer:v2
          coverage: none

      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Validate Composer Manifest
        run: composer validate --no-interaction

      - name: Audit PHP Dependencies
        run: composer audit --locked --no-interaction

      # No advisory is accepted: pnpm-workspace.yaml has no audit.ignore, so a
      # local pnpm audit and this step agree. See SECURITY.md "Known issues".
      - name: Audit JavaScript Dependencies
        run: pnpm audit --audit-level=high

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The cache scope matches the linux/amd64 build in the docker workflow,
      # so a tag build starts from the layers the last run on main produced.
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: maildun:ci
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Verify the extensions the application depends on
        run: |
          KEY="base64:$(head -c 32 /dev/urandom | base64)"
          docker run --rm -e APP_KEY="$KEY" maildun:ci \
            php -r '
              $missing = array_values(array_diff(
                  ["gd", "pcntl", "pdo_mysql", "pdo_pgsql", "pdo_sqlite", "posix", "redis"],
                  array_map("strtolower", get_loaded_extensions())
              ));
              if ($missing) {
                  fwrite(STDERR, "missing extensions: " . implode(", ", $missing) . PHP_EOL);
                  exit(1);
              }
              if (! function_exists("imagewebp")) {
                  fwrite(STDERR, "gd was built without WebP support" . PHP_EOL);
                  exit(1);
              }
              echo "extensions ok" . PHP_EOL;
            '

      # The MCP email builder tools shell out to Node through
      # App\Services\EmailBuilderAgent. Run one real check of a small design
      # through that class, so a missing node binary or a package the agent
      # imports but the image does not ship fails here.
      - name: Verify the email builder runtime
        run: |
          KEY="base64:$(head -c 32 /dev/urandom | base64)"
          docker run --rm -e APP_KEY="$KEY" maildun:ci \
            php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              try {
                  $result = $app->make(App\Services\EmailBuilderAgent::class)
                      ->run(null, "<p>Hello from CI</p>", "check_email");
              } catch (Illuminate\Validation\ValidationException $exception) {
                  fwrite(STDERR, implode(PHP_EOL, Illuminate\Support\Arr::flatten($exception->errors())) . PHP_EOL);
                  exit(1);
              }
              if (($result["ok"] ?? false) !== true || ! str_contains($result["html"], "Hello from CI")) {
                  fwrite(STDERR, "unexpected email builder result: " . json_encode($result) . PHP_EOL);
                  exit(1);
              }
              echo "email builder ok" . PHP_EOL;
            '

      - name: Verify the image boots and serves the health endpoint
        run: |
          KEY="base64:$(head -c 32 /dev/urandom | base64)"
          docker run -d --name maildun-ci -p 8080:8080 \
            -e APP_KEY="$KEY" \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=:memory: \
            -e CACHE_STORE=file \
            -e SESSION_DRIVER=file \
            -e QUEUE_CONNECTION=sync \
            maildun:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/up > /dev/null 2>&1; then
              echo "health endpoint responded after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the container never served /up" >&2
          docker logs maildun-ci
          exit 1

      # How Coolify-style platforms (Managed WP) install it: real environment
      # variables, no .env, and a read-only application root. The installer
      # must migrate, create the administrator and leave no .env behind.
      # The database is a file in /tmp, not :memory:, because the installer
      # rebuilds the config cache near the end and the reconnect would drop
      # an in-memory database before the final summary reads it.
      - name: Verify the installer runs on a platform-managed environment
        run: |
          KEY="base64:$(head -c 32 /dev/urandom | base64)"
          PASSWORD="Ci-$(head -c 18 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')-7."
          docker run --rm \
            -e APP_KEY="$KEY" \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/maildun-ci.sqlite \
            -e CACHE_STORE=array \
            -e SESSION_DRIVER=array \
            -e QUEUE_CONNECTION=sync \
            -e ADMIN_PASSWORD="$PASSWORD" \
            maildun:ci \
            sh -c 'touch "$DB_DATABASE" && php artisan app:install --no-interaction --force --skip-storage --registration=closed \
              --admin-name="CI Admin" --admin-email=ci@example.com --admin-password="$ADMIN_PASSWORD" \
              && test ! -f .env'

      - name: Container logs on failure
        if: failure()
        run: docker logs maildun-ci || true
